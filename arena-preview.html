<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Ferro & Lança — Arena 3D Preview</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d11;color:#eee}
    #app{position:fixed;inset:0}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    #hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));z-index:3;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 24px)}
    .card{background:rgba(12,14,18,.82);border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:9px 11px;backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.28)}
    .title{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
    .sub{font-size:10px;color:#aab2bd;margin-top:3px}
    button{appearance:none;border:1px solid rgba(242,173,85,.35);background:rgba(242,173,85,.08);color:#f0d29b;border-radius:8px;padding:8px 10px;font-weight:800;font-size:10px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
    button:hover{background:rgba(242,173,85,.14)}
    #status{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;font-size:11px;color:#c8d0d9;background:rgba(8,10,13,.76);border:1px solid rgba(255,255,255,.1);padding:7px 10px;border-radius:999px;backdrop-filter:blur(6px);white-space:nowrap}
    #error{position:fixed;inset:0;display:none;place-items:center;padding:24px;background:#0b0d11;z-index:10;text-align:center;color:#f2b1a5}
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <div class="card"><div class="title">Arena Hexagonal 3D</div><div class="sub">Arraste para girar · roda/pinça para zoom</div></div>
    <button id="reset">Resetar câmera</button>
    <button id="top">Vista tática</button>
  </div>
  <div id="status">Carregando Arena_Hexagonal.glb…</div>
  <div id="error"></div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const host=document.getElementById('app');
    const status=document.getElementById('status');
    const error=document.getElementById('error');

    try {
      const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
      renderer.setPixelRatio(Math.min(devicePixelRatio,2));
      renderer.setSize(innerWidth,innerHeight);
      renderer.outputColorSpace=THREE.SRGBColorSpace;
      renderer.toneMapping=THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure=1.05;
      renderer.shadowMap.enabled=true;
      renderer.shadowMap.type=THREE.PCFSoftShadowMap;
      host.appendChild(renderer.domElement);

      const scene=new THREE.Scene();
      scene.background=new THREE.Color(0x0b0d11);
      scene.fog=new THREE.FogExp2(0x0b0d11,0.018);

      const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.05,250);
      const controls=new OrbitControls(camera,renderer.domElement);
      controls.enableDamping=true;
      controls.dampingFactor=.065;
      controls.minPolarAngle=.28;
      controls.maxPolarAngle=Math.PI*.49;
      controls.enablePan=true;

      scene.add(new THREE.HemisphereLight(0xdde8ff,0x332518,2.25));
      const key=new THREE.DirectionalLight(0xffebd2,3); key.position.set(8,14,9); key.castShadow=true; scene.add(key);
      const rim=new THREE.DirectionalLight(0x9cabbc,.8); rim.position.set(-10,7,-7); scene.add(rim);

      const ground=new THREE.Mesh(new THREE.CircleGeometry(30,64),new THREE.MeshStandardMaterial({color:0x080a0d,roughness:1}));
      ground.rotation.x=-Math.PI/2; ground.position.y=-.34; ground.receiveShadow=true; scene.add(ground);

      let arena=null, center=new THREE.Vector3(), radius=10;
      function fitCamera(tactical=false){
        const r=Math.max(radius,4);
        const dir=tactical?new THREE.Vector3(0,1.45,1.65):new THREE.Vector3(1.15,1.05,1.35);
        dir.normalize().multiplyScalar(r*(tactical?2.05:2.15));
        camera.position.copy(center).add(dir);
        camera.near=Math.max(.01,r/100); camera.far=r*15; camera.updateProjectionMatrix();
        controls.target.copy(center); controls.update();
      }

      new GLTFLoader().load(
        'assets/arenas/hexagonal/Arena_Hexagonal.glb',
        gltf=>{
          arena=gltf.scene;
          arena.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
          scene.add(arena);
          const box=new THREE.Box3().setFromObject(arena);
          const sphere=box.getBoundingSphere(new THREE.Sphere());
          center.copy(sphere.center); radius=sphere.radius;
          fitCamera(true);
          status.textContent='Arena carregada · arraste para girar · roda/pinça para zoom';
        },
        ev=>{if(ev.total) status.textContent=`Carregando arena… ${Math.round(ev.loaded/ev.total*100)}%`;},
        err=>{
          console.error(err);
          status.style.display='none'; error.style.display='grid';
          error.innerHTML='<div><h2>Não foi possível carregar a arena</h2><p>O arquivo 3D não pôde ser carregado. Abra o console do navegador para detalhes.</p></div>';
        }
      );

      document.getElementById('reset').addEventListener('click',()=>fitCamera(false));
      document.getElementById('top').addEventListener('click',()=>fitCamera(true));
      addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
      renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
    } catch (err) {
      console.error(err);
      status.style.display='none';
      error.style.display='grid';
      error.innerHTML='<div><h2>Erro ao iniciar o viewer 3D</h2><p>'+String(err.message||err)+'</p></div>';
    }
  </script>
</body>
</html>
