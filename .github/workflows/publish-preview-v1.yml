name: Validate Ferrha prototype (test branch only)

# The old preview publisher pushed into main. This branch must never do that.
on:
  push:
    branches:
      - ui/ux-teste-visual-mecanicas
    paths:
      - assets/characters/ferrha/**
      - scripts/build_ferrha.py
      - scripts/validate_ferrha.py
      - scripts/preview_ferrha_clips.py
      - .github/workflows/publish-preview-v1.yml

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/ui/ux-teste-visual-mecanicas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependency
        run: python -m pip install numpy==2.4.6
      - name: Validate exported GLB and textures
        run: python scripts/validate_ferrha.py
      - name: Check game JavaScript syntax
        shell: bash
        run: |
          for file in js/*.js; do
            node --check "$file"
          done
      - name: Attach prototype for testing
        uses: actions/upload-artifact@v4
        with:
          name: ferrha-prototype
          path: assets/characters/ferrha/
          if-no-files-found: error
